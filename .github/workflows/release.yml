name: Release Theme Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Update npm to latest (fixes cross-platform optional dependencies bug)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Create installable WordPress theme zip
        run: |
          THEME_SLUG="hexleonwp"
          RELEASE_DIR="build-package/${THEME_SLUG}"
          
          mkdir -p "${RELEASE_DIR}"
          
          # Copy theme production files
          rsync -av --progress ./ "${RELEASE_DIR}" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.cursorrules' \
            --exclude 'node_modules' \
            --exclude 'src' \
            --exclude 'scripts' \
            --exclude 'build-package' \
            --exclude 'vite.config.js' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.vite-dev' \
            --exclude 'COMMANDS.md' \
            --exclude '*.zip'
          
          # Compress theme folder
          cd build-package
          zip -r "../${THEME_SLUG}.zip" "${THEME_SLUG}"
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: hexleonwp.zip
          generate_release_notes: true
          draft: false
          prerelease: false

